{% extends 'index.html' %}
{% load static %}

{% block main %}



<div class="login-page">

    <div class="login-card">

        <h2>
            🔧 Gestión de Reportes
        </h2>

        

        {% if form.errors %}
            <div class="alert alert-danger">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-control"
                    placeholder="Ingrese su usuario"
                    required
                    autofocus
                >

            </div>

            <div class="form-group">

                <label for="id_password">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-control"
                    placeholder="Ingrese su contraseña"
                    required
                >

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Iniciar Sesión

            </button>

        </form>

        <div class="mt-3 text-center">

            <a href="{% url 'password_reset' %}">
                ¿Olvidaste tu contraseña?
            </a>

        </div>

    </div>

</div>

{% endblock %}
