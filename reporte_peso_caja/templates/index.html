
{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Gestión de Reportes de Maquinaria
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{% static 'css/variables.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/base.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/components.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/login.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/dashboard.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/modal.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/tables.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/responsive.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/form.css' %}">
        
    <link rel="stylesheet"
          href="{% static 'css/layout.css' %}">
    

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="top-navbar">

        <div class="navbar-container">

            <!-- LOGO -->
            <div class="navbar-brand">

                <a href="{% url 'dashboard' %}">

                    📊 Gestión de Reportes

                </a>

            </div>

            <!-- MENU -->
            <div class="navbar-actions">

                {% if user.is_authenticated %}

                    <div class="user-info">

                        <span class="user-badge">

                            👋 {{ user.username }}

                        </span>

                    </div>

                    {% if role_name == 'admin' %}

                        <a href="{% url 'register' %}"
                           class="btn-custom btn-primary-custom">

                            ➕ Registrar Usuario

                        </a>

                    {% endif %}

                    <a href="{% url 'logout' %}"
                       class="btn-custom btn-danger-custom">

                        🔒 Cerrar sesión

                    </a>

                {% else %}

                    <a href="{% url 'login' %}"
                       class="btn-custom btn-primary-custom">

                        🔑 Iniciar sesión

                    </a>

                {% endif %}

            </div>

        </div>

    </nav>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-wrapper">

        {% block main %}
        {% endblock %}

    </main>

    <!-- JS -->
    <script src="{% static 'js/dashboard.js' %}"></script>

</body>

</html>
