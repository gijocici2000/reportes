<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Reportes de Maquinaria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        
        .dashboard {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #f5f5f5;
        }
        
        .dashboard.active {
            display: block;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .navbar h2 {
            font-size: 20px;
        }
        
        .navbar button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .navbar button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .dashboard-content {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .dashboard-header {
            margin-bottom: 30px;
        }
        
        .dashboard-header h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
        }
        
        .turno-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .turno-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .turno-btn.active {
            background: #667eea;
            color: white;
        }
        
        .turno-btn:hover {
            transform: translateY(-2px);
        }
        
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .report-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }
        
        .report-card h4 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .report-card p {
            color: #666;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .report-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-edit {
            background: #3498db;
            color: white;
        }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
        }
        
        .btn-new {
            background: #27ae60;
            color: white;
            padding: 15px 30px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h3 {
            color: #333;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="loginContainer">
        <h1>🔧 Reportes de Maquinaria</h1>
        <div class="error-message" id="errorMessage"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>
    </div>
    
    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="navbar">
            <h2>📊 Gestión de Reportes de Maquinaria</h2>
            <button onclick="logout()">Cerrar Sesión</button>
        </div>
        
        <div class="dashboard-content">
            <div class="dashboard-header">
                <h3>Reportes por Turno</h3>
                <div class="turno-selector">
                    <button class="turno-btn active" onclick="selectTurno('turno1')">Turno 1 (06:00 - 14:00)</button>
                    <button class="turno-btn" onclick="selectTurno('turno2')">Turno 2 (14:00 - 22:00)</button>
                    <button class="turno-btn" onclick="selectTurno('turno3')">Turno 3 (22:00 - 06:00)</button>
                </div>
                <button class="btn btn-new" onclick="openNewReportModal()">+ Nuevo Reporte</button>
            </div>
            
            <div id="reportsContainer" class="reports-grid"></div>
        </div>
    </div>
    
    <!-- Modal para nuevo/editar reporte -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Reporte</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="reportForm">
                <div class="form-group">
                    <label for="maquina">Maquinaria</label>
                    <input type="text" id="maquina" required>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
                        <option value="operativa">Operativa</option>
                        <option value="mantenimiento">Mantenimiento</option>
                        <option value="reparacion">Reparación</option>
                        <option value="parada">Parada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" rows="4" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit;"></textarea>
                </div>
                <div class="form-group">
                    <label for="tecnico">Técnico Responsable</label>
                    <input type="text" id="tecnico" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-new" style="flex: 1;">Guardar</button>
                    <button type="button" class="btn" style="flex: 1; background: #95a5a6; color: white;" onclick="closeModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        let currentUser = null;
        let currentTurno = 'turno1';
        let currentReportId = null;
        let reports = {
            turno1: [],
            turno2: [],
            turno3: []
        };
        
        // Cargar datos del localStorage
        function loadData() {
            const saved = localStorage.getItem('reports');
            if (saved) {
                reports = JSON.parse(saved);
            }
        }
        
        // Guardar datos en localStorage
        function saveData() {
            localStorage.setItem('reports', JSON.stringify(reports));
        }
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;
            
            // Validación simple (en producción usar un servidor)
            if (usuario && contrasena.length >= 3) {
                currentUser = usuario;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');
                loadData();
                renderReports();
            } else {
                document.getElementById('errorMessage').textContent = 'Usuario o contraseña inválidos';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
        
        // Logout
        function logout() {
            currentUser = null;
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginForm').reset();
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        // Seleccionar turno
        function selectTurno(turno) {
            currentTurno = turno;
            document.querySelectorAll('.turno-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderReports();
        }
        
        // Abrir modal nuevo reporte
        function openNewReportModal() {
            currentReportId = null;
            document.getElementById('modalTitle').textContent = 'Nuevo Reporte';
            document.getElementById('reportForm').reset();
            document.getElementById('reportModal').classList.add('active');
        }
        
        // Cerrar modal
        function closeModal() {
            document.getElementById('reportModal').classList.remove('active');
        }
        
        // Guardar reporte
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const reporte = {
                id: currentReportId || Date.now(),
                maquina: document.getElementById('maquina').value,
                estado: document.getElementById('estado').value,
                observaciones: document.getElementById('observaciones').value,
                tecnico: document.getElementById('tecnico').value,
                fecha: new Date().toLocaleDateString(),
                hora: new Date().toLocaleTimeString()
            };
            
            if (currentReportId) {
                reports[currentTurno] = reports[currentTurno].map(r => r.id === currentReportId ? reporte : r);
            } else {
                reports[currentTurno].push(reporte);
            }
            
            saveData();
            renderReports();
            closeModal();
        });
        
        // Editar reporte
        function editReport(id) {
            currentReportId = id;
            const reporte = reports[currentTurno].find(r => r.id === id);
            
            document.getElementById('modalTitle').textContent = 'Editar Reporte';
            document.getElementById('maquina').value = reporte.maquina;
            document.getElementById('estado').value = reporte.estado;
            document.getElementById('observaciones').value = reporte.observaciones;
            document.getElementById('tecnico').value = reporte.tecnico;
            
            document.getElementById('reportModal').classList.add('active');
        }
        
        // Eliminar reporte
        function deleteReport(id) {
            if (confirm('¿Está seguro que desea eliminar este reporte?')) {
                reports[currentTurno] = reports[currentTurno].filter(r => r.id !== id);
                saveData();
                renderReports();
            }
        }
        
        // Renderizar reportes
        function renderReports() {
            const container = document.getElementById('reportsContainer');
            const turnoReports = reports[currentTurno];
            
            if (turnoReports.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No hay reportes para este turno</p></div>';
                return;
            }
            
            container.innerHTML = turnoReports.map(reporte => `
                <div class="report-card">
                    <h4>${reporte.maquina}</h4>
                    <p><strong>Estado:</strong> ${reporte.estado}</p>
                    <p><strong>Técnico:</strong> ${reporte.tecnico}</p>
                    <p><strong>Fecha:</strong> ${reporte.fecha}</p>
                    <p><strong>Hora:</strong> ${reporte.hora}</p>
                    <p><strong>Observaciones:</strong> ${reporte.observaciones || 'N/A'}</p>
                    <div class="report-actions">
                        <button class="btn btn-edit" onclick="editReport(${reporte.id})">Editar</button>
                        <button class="btn btn-delete" onclick="deleteReport(${reporte.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('reportModal');
            if (event.target === modal) {
                closeModal();
            }
        };
        
        loadData();
    </script>
</body>
</html>
