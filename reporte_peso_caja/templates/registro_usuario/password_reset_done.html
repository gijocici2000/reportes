
{% extends 'index.html' %}

{% block main %}

<div class="auth-container">

    <div class="auth-card card-custom">

        <div class="auth-header">

            <h2>
                📧 Revisa tu correo
            </h2>

            <p>
                Te hemos enviado instrucciones para
                restablecer tu contraseña.
            </p>

        </div>

        <div class="info-message">

            <p>
                Verifica tu bandeja de entrada y también
                la carpeta de spam o correo no deseado.
            </p>

        </div>

        <div class="auth-actions">

            <a href="{% url 'login' %}"
               class="btn-custom btn-primary">

                Regresar

            </a>

        </div>

    </div>

</div>

{% endblock %}
