
{% extends 'index.html' %}

{% block main %}

<div class="auth-container">

    <div class="auth-card card-custom">

        <div class="auth-header">

            <h2>
                🔒 Recuperar contraseña
            </h2>

            <p>
                Ingresa tu correo electrónico para
                recibir instrucciones de recuperación.
            </p>

        </div>

        <form method="post"
              class="custom-form">

            {% csrf_token %}

            <div class="form-fields">

                {{ form.as_p }}

            </div>

            <div class="auth-actions">

                <button type="submit"
                        class="btn-custom btn-primary">

                    Enviar instrucciones

                </button>

                <a href="{% url 'login' %}"
                   class="btn-custom btn-secondary-custom">

                    Regresar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
```
